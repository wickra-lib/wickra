[workspace]
resolver = "2"
members = [
    "crates/wickra-core",
    "crates/wickra",
    "crates/wickra-data",
    "bindings/python",
    "bindings/wasm",
    "bindings/node",
    "bindings/c",
    "examples/rust",
    "crates/wickra-bench",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.4"
authors = ["kingchenc <support@wickra.org>"]
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wickra-lib/wickra"
homepage = "https://github.com/wickra-lib/wickra"
readme = "README.md"
keywords = ["finance", "trading", "indicators", "technical-analysis", "ta"]
categories = ["finance", "mathematics", "science"]

[workspace.dependencies]
wickra-core = { path = "crates/wickra-core", version = "1.0.4" }
wickra-data = { path = "crates/wickra-data", version = "1.0.4" }

thiserror = "2"
rayon = "1"

# Testing
proptest = "1"
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }

# Python binding
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic exceptions for an indicator library that uses floats and small functions everywhere.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
float_cmp = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort. The bindings are workspace members, and Cargo refuses
# `panic` in a per-package profile override ("`panic` may not be specified in a
# `package` profile"), so whatever is set here is what the Python, Node, WASM and
# C ABI cdylibs are built with. pyo3 and napi both convert a panic into a
# language-level exception via `catch_unwind`; with `abort` that machinery can
# never run, so any panic reaching an FFI boundary killed the host process
# instead of raising. Unwinding out of `extern "C"` is itself undefined, which is
# precisely why those crates catch it first.
panic = "unwind"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 0
debug = true
