name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default for the auto-injected GITHUB_TOKEN. The publish jobs
# (cargo/python/node) push to external registries via their own secrets
# (CARGO_REGISTRY_TOKEN / PYPI_API_TOKEN / NPM_TOKEN), not the GITHUB_TOKEN, so
# they need no repo write. The jobs that genuinely write through the
# GITHUB_TOKEN — github-release (contents: write), node-/wasm-publish and
# attestations (id-token / attestations: write) — declare those rights in their
# own job-level permissions blocks, which override this default (OpenSSF
# Scorecard: Token-Permissions).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm inside any build or publish step
  # (cargo, napi, maturin, wasm-pack, npm) retries automatically instead of
  # failing the job. Cargo treats "couldn't resolve host" / connect / timeout as
  # spurious and retries with backoff; 10 attempts ride out a transient DNS blip.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  # --------------------------------------------------------------------------
  # crates.io: three crates in dependency order
  # --------------------------------------------------------------------------
  # Nothing reaches a registry until every artefact exists and the tagged commit
  # is known to have been green. Before this job, cargo-publish and wasm-publish
  # declared no dependencies at all: crates.io could receive a version while the
  # Python wheels were still building, and a wheel failing afterwards left the
  # crate published and unwithdrawable. Six registries cannot be made atomic,
  # but the common failure -- something does not build -- can be moved in front
  # of the first irreversible step instead of running beside it.
  gate:
    name: Nothing publishes before this
    needs: [python-wheels, python-sdist, node-build, c-abi-build, wasm-build]
    runs-on: ubuntu-latest
    # Generous because this job waits for ci.yml to settle on the tagged commit;
    # the wait itself is bounded to 45 minutes inside the step.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      # workflow_dispatch exists so a release whose publish step failed can be
      # re-run without moving the tag. It must not become a way to publish from
      # a branch: dispatched from main, GITHUB_REF_NAME is "main", cargo/npm/PyPI
      # would push whatever the manifests currently say, and go-mirror would
      # replace the contents of the public wickra-go and tag it "vmain".
      #
      # The `release` environment carries no deployment-branch policy, so this is
      # the only thing standing in the way. Checked here rather than on each
      # publish job: one gate, and a job that is skipped rather than failed reads
      # as "nothing to do" instead of "refused".
      - name: Refuse to publish from anything but a version tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) echo "publishing for $REF" ;;
            *)
              echo "::error::release.yml publishes only for a refs/tags/v* ref; got $REF"
              exit 1
              ;;
          esac

      - name: The tagged commit must have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # ci.yml runs on pushes to main and on pull requests, never on a tag,
          # so this workflow cannot see the tag's health in its own run. Ask what
          # the commit itself was graded, which is the merge commit the tag
          # points at and therefore the state that was actually tested.
          #
          # A run that is still going carries conclusion `null`, which reads the
          # same as one that failed -- and a tag pushed straight after its merge
          # lands while ci.yml is still queued. Refusing there turns "tagged a
          # minute early" into a failed release that needs a rerun, so wait for
          # the verdict instead of treating its absence as one. A red conclusion
          # still ends this immediately: only the undecided case waits.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            ci_state=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1"                  -q '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')
            ci_status=${ci_state%% *}
            ci=${ci_state##* }
            if [ "$ci" = "success" ]; then
              break
            fi
            if [ "$ci" != "null" ]; then
              echo "::error::ci.yml on ${SHA} is ${ci}; refusing to publish"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml on ${SHA} did not finish within 45 minutes (${ci_status}); refusing to publish"
              exit 1
            fi
            echo "ci.yml on ${SHA}: ${ci_status} -- waiting"
            sleep 30
          done
          echo "ci.yml on ${SHA}: success"

          # And nothing else that did run may have failed. Listing required
          # workflows by name would go stale -- codspeed.yml is path-filtered and
          # legitimately does not run for a version bump -- so the rule is about
          # outcomes rather than about a roster: whatever ran, none of it is red.
          #
          # Only the newest run of each workflow counts. ci.yml carries
          # `concurrency: cancel-in-progress` off main, so a commit that receives
          # two push events has its first run cancelled by its second; without
          # the grouping any commit that ran CI twice is unreleasable however
          # green the surviving run was (wickra-strategy-ci lost a release to
          # exactly that: 51 superseded checks, zero real failures). Within the
          # newest run, cancelled is red: a cancelled CI is not a green CI.
          #
          # Dependabot's own runs are not this repository's CI: when it tries a
          # security update on the tagged commit and the update is impossible
          # (a pin, a transitive dependency with no fixed line), that run is
          # red on the SHA without a single job of ours having failed. They
          # carry `event: dynamic`, which nothing of ours does.
          bad=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                  -q '[.workflow_runs[] | select(.name != "Release" and .event != "dynamic")]
                      | group_by(.name) | map(max_by(.id))
                      | map(select(.conclusion == "failure" or .conclusion == "timed_out"
                                   or .conclusion == "cancelled"))
                      | map(.name) | unique | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::the tagged commit has failing runs (${bad}); refusing to publish"
            exit 1
          fi
          echo "every workflow that ran on this commit is green"

  cargo-publish:
    name: Publish to crates.io
    needs: [gate]
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    runs-on: ubuntu-latest
    # The publish jobs run with long-lived registry tokens. Binding them to a
    # protected GitHub environment lets the org require a reviewer to approve
    # each release and restrict which tags/branches may deploy, so the secrets
    # are not reachable from an arbitrary workflow run. The `release`
    # environment and its protection rules are configured under repo
    # Settings -> Environments.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      # Idempotent publishing: if the version is already on crates.io we
      # treat that as success so re-runs of the workflow don't fail.
      - name: Publish wickra-core (idempotent)
        run: |
          # if/then rather than `A && B || C`: that form runs C when B fails, not
          # only when A does, so a failing echo would read as a failed publish
          # (shellcheck SC2015).
          if out=$(cargo publish -p wickra-core --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra-data (idempotent)
        run: |
          # if/then rather than `A && B || C`: that form runs C when B fails, not
          # only when A does, so a failing echo would read as a failed publish
          # (shellcheck SC2015).
          if out=$(cargo publish -p wickra-data --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra (idempotent)
        run: |
          # if/then rather than `A && B || C`: that form runs C when B fails, not
          # only when A does, so a failing echo would read as a failed publish
          # (shellcheck SC2015).
          if out=$(cargo publish -p wickra --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Produce .crate files for the GitHub Release attachments. `cargo package`
      # writes them to target/package/<name>-<version>.crate.
      #
      # No --allow-dirty: `actions/checkout` gives a clean tree and nothing
      # above mutates it. No --no-verify: every crate was just published to
      # crates.io in the steps above, so the verification build resolves its
      # workspace dependencies from the registry and confirms each .crate
      # actually builds before it is attached to the release.
      - name: Build .crate files for release attachment
        run: |
          cargo package -p wickra-core
          cargo package -p wickra-data
          cargo package -p wickra

      - name: Upload .crate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate

      # CycloneDX SBOM per published crate. Attached to the GitHub Release
      # alongside the .crate / .whl / .tgz artefacts so downstream
      # consumers can audit the published dependency tree without
      # re-resolving Cargo.lock.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        run: |
          # cargo-cyclonedx walks the whole workspace in a single pass and
          # writes a <package>.cdx.json next to each member's Cargo.toml; it
          # has no -p/--package selector. Collect the three crates.io crates
          # (the .crate files published by this job) into the upload dir.
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/wickra-core/wickra-core.cdx.json sboms/
          cp crates/wickra-data/wickra-data.cdx.json sboms/
          cp crates/wickra/wickra.cdx.json sboms/
          ls -lh sboms/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  # --------------------------------------------------------------------------
  # PyPI: cross-platform wheels + sdist
  # --------------------------------------------------------------------------
  python-wheels:
    name: Build wheels (${{ matrix.target }}/${{ matrix.manylinux }} on ${{ matrix.os }})
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc Linux (manylinux)
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          # musl Linux (Alpine and other musl distros)
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # macOS
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          # Windows
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: setup_python
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Wait before Python retry
        if: steps.setup_python.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-python failed (likely CDN flake), waiting 30s before retry..."
          sleep 30
      - name: Set up Python (retry)
        if: steps.setup_python.outcome == 'failure'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Sync root README into bindings/python so it ships with the wheel
        shell: bash
        run: cp README.md bindings/python/README.md
      # The container image comes from quay.io, which has failed whole
      # afternoons (502/504 on the manifest). The first attempt may fail
      # without failing the row; a pause and one identical retry follow, the
      # family's retry pair. A second failure is the row's verdict.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        id: wheel
        continue-on-error: true
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          # The live-binance data layer links native-tls -> openssl-sys, which
          # needs OpenSSL at build time. The manylinux containers lack the headers
          # and the musllinux build cross-compiles against a musl sysroot with no
          # OpenSSL at all, so build the Linux wheels with vendored OpenSSL
          # (compiled from source, linked statically). No-op on the native
          # macOS/Windows runners, where native-tls never pulls openssl-sys. The
          # CI `python-wheel-container-smoke` job exercises both containers on PRs.
          args: --release --strip --out dist --features vendored-tls
          manylinux: ${{ matrix.manylinux }}
          # Building OpenSSL from source needs Perl modules (IPC::Cmd,
          # Time::Piece, ...) the minimal manylinux (CentOS 7) image lacks.
          # perl-core pulls the full distribution; the explicit names document
          # the ones OpenSSL's Configure has required. The musllinux cross image
          # ships a complete Perl and has no yum, so this is a no-op there.
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then yum install -y perl-core perl-IPC-Cmd perl-Data-Dumper perl-Time-Piece; fi
      - name: Pause before retrying the wheel build
        if: steps.wheel.outcome == 'failure'
        shell: bash
        run: sleep 90
      - if: steps.wheel.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          # The live-binance data layer links native-tls -> openssl-sys, which
          # needs OpenSSL at build time. The manylinux containers lack the headers
          # and the musllinux build cross-compiles against a musl sysroot with no
          # OpenSSL at all, so build the Linux wheels with vendored OpenSSL
          # (compiled from source, linked statically). No-op on the native
          # macOS/Windows runners, where native-tls never pulls openssl-sys. The
          # CI `python-wheel-container-smoke` job exercises both containers on PRs.
          args: --release --strip --out dist --features vendored-tls
          manylinux: ${{ matrix.manylinux }}
          # Building OpenSSL from source needs Perl modules (IPC::Cmd,
          # Time::Piece, ...) the minimal manylinux (CentOS 7) image lacks.
          # perl-core pulls the full distribution; the explicit names document
          # the ones OpenSSL's Configure has required. The musllinux cross image
          # ships a complete Perl and has no yum, so this is a no-op there.
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then yum install -y perl-core perl-IPC-Cmd perl-Data-Dumper perl-Time-Piece; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Include manylinux in the name so the glibc and musl x86_64/aarch64
          # builds do not collide on the same artifact name.
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*

  python-sdist:
    name: Build Python sdist
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync root README into bindings/python so it ships in the sdist
        run: cp README.md bindings/python/README.md
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: bindings/python/dist/*

  python-publish:
    name: Publish to PyPI
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # npm: per-platform native binaries + main meta-package
  # --------------------------------------------------------------------------
  node-build:
    name: Node build (${{ matrix.target }})
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Wait before Node retry
        if: steps.setup_node.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-node failed (likely CDN flake), waiting 30s before retry..."
          sleep 30

      - name: Set up Node (retry)
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      - name: Install Node deps
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd bindings/node && npm ci
          shell: bash

      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/wickra.*.node
          if-no-files-found: error

  node-publish:
    name: Publish to npm
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, node-build]
    runs-on: ubuntu-latest
    environment: release
    # `id-token: write` lets npm publish embed a Sigstore provenance
    # attestation generated from the GitHub Actions OIDC token. The npm
    # registry then shows a "Verified provenance" badge and lets
    # consumers verify the package was built from this exact workflow
    # run.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Wait before Node retry
        if: steps.setup_node.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-node failed (likely CDN flake), waiting 30s before retry..."
          sleep 30

      - name: Set up Node (retry)
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install Node deps
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd bindings/node && npm ci
          shell: bash

      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: bindings-*

      # The npm/<platform>/package.json templates are committed to the
      # repo (see bindings/node/npm/), so `napi artifacts` only needs to
      # drop the freshly built .node binary into the matching directory.
      - name: Move binaries into platform package layout
        working-directory: bindings/node
        # napi-rs CLI 3 renamed `--dir` to `--output-dir` (`-d`).
        run: npx napi artifacts --output-dir artifacts

      # Publish each platform package individually. Skip versions that are
      # already on npm. A first-attempt 403 from npm's spam filter is
      # tolerated for a single 30-second retry — that historically clears
      # rate-limit-driven false positives. Anything that still fails after
      # the retry is a *real* failure (the platform binary will be missing
      # from `optionalDependencies` and Windows-style installs will break,
      # exactly the regression that produced audit finding R20) — fail the
      # job loudly so the release does not silently land in a half-published
      # state. Previously this loop swallowed the second-attempt failure with
      # a `::warning::` and `return 0`; that mask is removed.
      # The SPDX expression in every manifest is a reference to two documents;
      # none of the npm packages carried either. check_license_copies.py says
      # npm is 'handled at publish time' -- true in wickra-backtest, which has
      # this step, and never true here, so the assertion delegated to a
      # mechanism that did not exist.
      #
      # Copying is not enough: `files` decides what npm packs, and a name
      # missing from it is dropped without a word. `npm pack --dry-run` is
      # asked what would actually go out, before it goes out.
      # `napi artifacts` distributes the downloaded binaries into npm/*/ by
      # name. If a platform's build artefact never arrived, its directory is
      # simply left without a .node -- and the loop below would publish a stub
      # that installs cleanly and then fails at require() on that platform.
      # node-build uses if-no-files-found: error and gate waits on it, so this
      # is hard to reach; it is also cheap to prove rather than assume.
      - name: Every platform package has its binary
        working-directory: bindings/node
        run: |
          set -euo pipefail
          missing=0
          for dir in npm/*/; do
            pkg=$(basename "$dir")
            if ! ls "$dir"/*.node >/dev/null 2>&1; then
              echo "::error::wickra-$pkg has no .node binary; it would publish as an empty stub"
              missing=1
            else
              echo "wickra-$pkg: $(basename "$dir"/*.node)"
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Stage the licence texts and prove they will be packed
        working-directory: bindings/node
        run: |
          set -euo pipefail
          for dir in . npm/*/; do
            cp ../../LICENSE-MIT ../../LICENSE-APACHE "$dir/"
          done
          for dir in . npm/*/; do
            # The ${...} below are JavaScript template literals inside a
            # single-quoted node script, not shell expansions.
            # shellcheck disable=SC2016
            ( cd "$dir" && npm pack --dry-run --json ) | node -e '
              const chunks = [];
              process.stdin.on("data", c => chunks.push(c));
              process.stdin.on("end", () => {
                const pkg = JSON.parse(chunks.join(""))[0];
                const names = pkg.files.map(f => f.path);
                const missing = ["LICENSE-MIT", "LICENSE-APACHE"].filter(n => !names.includes(n));
                if (missing.length) {
                  console.error(`::error::${pkg.name} would publish without ${missing.join(" and ")}`);
                  process.exit(1);
                }
                console.log(`${pkg.name}: licence texts present`);
              });'
          done

      - name: Publish platform packages (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          fail=0
          publish_dir() {
            local dir=$1
            local pkg
            pkg=$(basename "$dir")
            local pkgname="wickra-$pkg"
            local existing
            existing=$(npm view "$pkgname@$version" version 2>/dev/null)
            if [ "$existing" = "$version" ]; then
              echo "::notice::skip $pkgname@$version (already on npm)"
              return 0
            fi
            echo "::group::publish $pkgname@$version"
            # --ignore-scripts: a per-platform package must never run lifecycle
            # scripts during publish (npm runs prepublishOnly/prepare/etc. from
            # the package being published — a malicious or stray script would
            # execute with the npm token in the environment).
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::first attempt of $pkgname failed (rc=$rc); retrying after 30s"
              sleep 30
              (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
              rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkgname could not be published — the release would land with a missing platform binary; failing the job."
              return 1
            fi
            return 0
          }
          for dir in npm/*/; do
            publish_dir "$dir" || fail=1
          done
          exit $fail

      - name: Sync root README into bindings/node so it ships with the npm tarball
        # npm reads README.md from the package directory at publish time. Copy
        # the canonical root README in just before the publish so every
        # registry shows the same project page.
        shell: bash
        run: cp ../../README.md README.md
        working-directory: bindings/node

      - name: Publish main package to npm (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          # GitHub Actions defaults to `bash -e`. `npm view` on a not-yet-
          # published package returns 1, which would kill the step before
          # we got to publish. Force a graceful empty result instead.
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "wickra@$version" version 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "::notice::skip wickra@$version (already on npm)"
            exit 0
          fi
          # --ignore-scripts so any leftover prepublish hooks (which would
          # otherwise try to republish the already-published platform
          # subpackages) can't sabotage the main publish.
          npm publish --access public --ignore-scripts --provenance
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first attempt failed (rc=$rc); retrying after 30s"
            sleep 30
            npm publish --access public --ignore-scripts --provenance
            rc=$?
          fi
          exit $rc

      - name: Pack node tarballs for release attachment
        working-directory: bindings/node
        run: |
          # Main package
          npm pack --ignore-scripts
          # Each per-platform package (the binaries were already moved in by
          # napi artifacts). --ignore-scripts for the same reason as publish:
          # packing must not execute lifecycle scripts from the packed dir.
          for d in npm/*/; do
            (cd "$d" && npm pack --ignore-scripts)
          done

      - name: Upload Node tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarballs
          path: |
            bindings/node/*.tgz
            bindings/node/npm/*/*.tgz

  # --------------------------------------------------------------------------
  # WASM: wasm-pack build + npm publish (as `wickra-wasm`)
  # --------------------------------------------------------------------------
  # Note: this job's npm publish call uses `--provenance` (see below),
  # which requires the `id-token: write` permission set at the job level.
  # The WASM package is built here rather than inside the publish job, so a
  # build failure lands in front of the gate instead of after crates.io has
  # already received the version. What is published downstream is the very
  # tarball this job packs and attaches to the release, so the two cannot
  # diverge.
  wasm-build:
    name: Build wickra-wasm
    timeout-minutes: 45 # backstop only: compiles from source; far above the ~10 min real runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Wait before Node retry
        if: steps.setup_node.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-node failed (likely CDN flake), waiting 30s before retry..."
          sleep 30

      - name: Set up Node (retry)
        if: steps.setup_node.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      - name: Install wasm-pack (latest, via prebuilt binary)
        # See the matching note in ci.yml: jetli's default installs an old
        # 0.10.x wasm-pack whose build subcommand rejects --features.
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        timeout-minutes: 10 # fail fast on a stuck download instead of hanging the job
        with:
          tool: wasm-pack

      - name: Sync root README into bindings/wasm so wasm-pack ships it in pkg/
        # wasm-pack copies the crate's README.md into the generated pkg/
        # directory it then publishes. Refresh it from the canonical root
        # README right before the build.
        run: cp README.md bindings/wasm/README.md

      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release --features panic-hook

      - name: Enrich generated package.json with author + repo metadata
        working-directory: bindings/wasm/pkg
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Pack wickra-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack

      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-wasm-*.tgz

  wasm-publish:
    name: Publish wickra-wasm to npm
    needs: [gate, wasm-build]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: release
    # `id-token: write` lets npm publish embed a Sigstore provenance
    # attestation generated from the GitHub Actions OIDC token (same
    # mechanism as the node-publish job above).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-tarball
          path: wasm-pkg

      - name: Publish wickra-wasm to npm (idempotent)
        run: |
          set -euo pipefail
          tarball=$(find wasm-pkg -name 'wickra-wasm-*.tgz' | head -1)
          if [ -z "$tarball" ]; then
            echo "::error::wasm-build produced no tarball"
            exit 1
          fi
          # if/then rather than `A && B || C`: that form runs C when B fails,
          # not only when A does, so a failing echo would read as a failed
          # publish (shellcheck SC2015).
          # "./" is load-bearing: npm reads a bare `dir/file.tgz` as the
          # `owner/repo` GitHub shorthand and tries to clone it, rather than
          # reading the file. Without it the step dies on `git ls-remote` with
          # code 128, before it ever reaches the registry.
          if out=$(npm publish "./$tarball" --access public --provenance 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "You cannot publish over"; then
            echo "skip: version already on npm"
          else
            echo "$out"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # GitHub Release: attach every built artefact to the tag's release page.
  #
  # The release is created as a DRAFT here and only flipped to published by the
  # downstream publish-release job, after the provenance bundle is attached. That
  # ordering (draft -> attach everything -> publish) makes the pipeline compatible
  # with GitHub release immutability, which locks assets at publish time (P24):
  # the old "publish, then upload provenance" order would have the provenance
  # upload rejected once immutability is enabled.
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # C ABI native libraries (bindings/c) — built per target on a native runner
  # (no cross toolchain needed) and attached to the GitHub Release as the
  # distribution channel. There is no package registry for the C ABI.
  # --------------------------------------------------------------------------
  c-abi-build:
    name: C ABI library (${{ matrix.target }})
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6

      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-c --release --target ${{ matrix.target }}

      - name: Package header + libraries
        shell: bash
        run: |
          set -e
          dir="wickra-c-${{ matrix.target }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/wickra.h bindings/c/include/wickra.hpp "$dir/include/"
          for f in libwickra.so libwickra.a libwickra.dylib wickra.dll wickra.dll.lib wickra.lib; do
            src="target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" "$dir/lib/"
          done
          tar -czf "$dir.tar.gz" "$dir"
          echo "packaged $dir:"; ls -lR "$dir"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: wickra-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Pack and publish the .NET binding to NuGet. The nupkg it packs is uploaded as
  # a build artifact so github-release can attach it. Authentication uses NuGet
  # Trusted Publishing (OIDC) — no long-lived API key. The 'wickra-release'
  # trusted-publishing policy on nuget.org (owner KingchenC, repo wickra-lib/wickra,
  # workflow release.yml) exchanges the GitHub OIDC token for a short-lived key.
  csharp-publish:
    name: Publish to NuGet
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # request the GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts

      - name: Stage native libraries into runtimes/<rid>/native
        shell: bash
        run: |
          set -e
          declare -A RID=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/csharp/Wickra/runtimes
          for target in "${!RID[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${RID[$target]}/native"; mkdir -p "$dest"
            for f in libwickra.so libwickra.dylib wickra.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -z "$src" ] && continue
              # The managed assembly is Wickra.dll and Windows file names are
              # case-insensitive, so shipping the native library as wickra.dll
              # gives two package files the same relative path once a
              # RID-specific publish flattens runtimes/ into the output folder.
              # The SDK rejects that with NETSDK1152, which made `dotnet publish`
              # fail for every Windows app referencing the package. WickraNative
              # looks for this name first.
              if [ "$f" = "wickra.dll" ]; then
                cp "$src" "$dest/wickra_native.dll"
              else
                cp "$src" "$dest/"
              fi
            done
            echo "staged ${RID[$target]}:"; ls -l "$dest"
          done

      # dotnet pack restores from nuget.org first; retry so a transient restore
      # blip retries instead of failing the release.
      - name: Pack
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: |
            version="${GITHUB_REF_NAME#v}"
            dotnet pack bindings/csharp/Wickra/Wickra.csproj -c Release -p:Version="$version" -o nupkg

      # Exchange the GitHub OIDC token for a short-lived (~1h) NuGet API key.
      # 'user' is the nuget.org profile name (the package owner), not an email.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: KingchenC

      # Pass the temporary key through the environment (not string-interpolated
      # into the script) so it cannot be parsed as shell — avoids template injection.
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload the NuGet package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Publish the Java binding to Maven Central. The jar this job packages is also
  # uploaded as a build artifact so github-release can attach the very file Maven
  # Central received. The Maven Central namespace (org.wickra) is verified;
  # authentication uses the Sonatype Central Portal token (CENTRAL_USERNAME /
  # CENTRAL_PASSWORD) and artifacts are signed with the GPG key (GPG_PRIVATE_KEY
  # / GPG_PASSPHRASE). The pom version must match the release tag (kept in sync
  # by the version-bump checklist).
  java-publish:
    name: Publish to Maven Central
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts

      - name: Stage native libraries into resources/native/<os>-<arch>
        shell: bash
        run: |
          set -e
          declare -A PLAT=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/java/src/main/resources/native
          for target in "${!PLAT[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${PLAT[$target]}"; mkdir -p "$dest"
            for f in libwickra.so libwickra.dylib wickra.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${PLAT[$target]}:"; ls -l "$dest"
          done

      # setup-java writes a settings.xml with the 'central' server credentials
      # (mapped from the env vars below) and imports the GPG signing key.
      - name: Set up JDK 25 + Maven Central credentials + GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java -Prelease deploy -DskipTests

      # `deploy` packages before it uploads, so the signed jar is already under
      # target/. Only the main artefact is kept: the sources and javadoc jars
      # belong on Maven Central, where a build tool resolves them on demand, and
      # would only pad the release page.
      - name: Upload the Java jar as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-jar
          path: |
            bindings/java/target/*.jar
            !bindings/java/target/*-sources.jar
            !bindings/java/target/*-javadoc.jar
          if-no-files-found: error

  # Mirror the in-repo Go module (bindings/go) to the standalone wickra-go
  # repository so `go get github.com/wickra-lib/wickra-go` builds with no extra
  # steps. The in-repo module keeps the prebuilt libraries git-ignored; the
  # mirror commits them per platform under lib/<goos>_<goarch>/ alongside the
  # vendored header. Produces no asset, but the release notes tell readers the
  # Go module is live, so github-release waits on it rather than saying so ahead
  # of time. The push uses a fine-grained PAT
  # (GO_MIRROR_TOKEN, contents:write on wickra-go); the mirror is a
  # derived artifact, so its bot commit is intentionally unsigned.
  go-mirror:
    name: Mirror the Go module to wickra-go
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts

      - name: Assemble the wickra-go module tree
        shell: bash
        run: |
          set -e
          out=wickra-go-module
          mkdir -p "$out/include" "$out/lib"
          # Single-package Go source + vendored C ABI header. The *_test.go
          # files stay behind: they read ../../testdata/golden, a path that
          # exists in this repository and not in a module fetched with `go get`,
          # so shipping them means `go test` on the published module fails at
          # os.Open. The tests belong to the source repo; the module ships the
          # library.
          find bindings/go -maxdepth 1 -name '*.go' -not -name '*_test.go' \
            -exec cp {} "$out/" \;
          cp bindings/go/include/wickra.h "$out/include/"
          cp bindings/go/README.md "$out/"
          # Ship the dual license so pkg.go.dev detects a redistributable license.
          cp LICENSE-MIT LICENSE-APACHE "$out/"
          # Standalone module path (the in-repo go.mod points at the subdir).
          printf 'module github.com/wickra-lib/wickra-go\n\ngo 1.23\n' > "$out/go.mod"
          # Point install instructions at the standalone module path.
          sed -i 's#github.com/wickra-lib/wickra/bindings/go#github.com/wickra-lib/wickra-go#g' \
            "$out/README.md" "$out"/*.go
          # Stage each prebuilt library under lib/<goos>_<goarch>/ (committed in
          # the mirror, unlike the in-repo lib/.gitignore). "<dir> <libfile>".
          declare -A GO=(
            [x86_64-unknown-linux-gnu]="linux_amd64 libwickra.so"
            [aarch64-unknown-linux-gnu]="linux_arm64 libwickra.so"
            [x86_64-apple-darwin]="darwin_amd64 libwickra.dylib"
            [aarch64-apple-darwin]="darwin_arm64 libwickra.dylib"
            [x86_64-pc-windows-msvc]="windows_amd64 wickra.dll"
            [aarch64-pc-windows-msvc]="windows_arm64 wickra.dll"
          )
          for target in "${!GO[@]}"; do
            read -r dir libfile <<< "${GO[$target]}"
            archive=$(find c-abi-artifacts -name "wickra-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            src=$(find "$tmp" -name "$libfile" | head -1)
            if [ -z "$src" ]; then
              echo "::error::missing $libfile for $target"; exit 1
            fi
            mkdir -p "$out/lib/$dir"; cp "$src" "$out/lib/$dir/"
          done
          echo "assembled module:"; find "$out" -type f | sort

      - name: Set up Go
        id: setup-go
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      - name: Retry Go setup (CDN flake)
        if: steps.setup-go.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::setup-go failed (likely CDN flake), waiting 30s before retry..."
          sleep 30

      - name: Set up Go (retry)
        if: steps.setup-go.outcome == 'failure'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      # Nothing here ever compiled the module it publishes. The tree is
      # assembled by copying files and rewriting an import path with sed, and
      # was pushed to pkg.go.dev on that basis alone -- a wrong header, a
      # missing library or a botched sed would have surfaced on a user's
      # machine. Build it, and run it, before it leaves.
      - name: Verify the assembled module builds and runs
        shell: bash
        run: |
          set -euo pipefail
          cd wickra-go-module
          cat > smoke_main_test.go <<'GO'
          package wickra

          import "testing"

          // Links against the staged linux_amd64 library and exercises one
          // indicator end to end: constructor, update, destructor. Compiling
          // proves the header and the cgo directives; running proves the
          // library is actually loadable.
          func TestAssembledModuleSmoke(t *testing.T) {
            s, err := NewSma(3)
            if err != nil {
              t.Fatalf("NewSma: %v", err)
            }
            defer s.Close()
            var last float64
            for _, v := range []float64{1, 2, 3, 4, 5} {
              last = s.Update(v)
            }
            if last < 3.999999999 || last > 4.000000001 {
              t.Fatalf("sma(3) over 1..5 = %v, want 4", last)
            }
          }
          GO
          go vet ./...
          go test -run TestAssembledModuleSmoke -v ./...
          rm smoke_main_test.go
          echo "module builds, links and runs"

      - name: Push to wickra-go and tag the release
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/wickra-lib/wickra-go.git"
          git clone -q "$remote" mirror-repo
          cd mirror-repo
          git config user.name "wickra-bot"
          git config user.email "support@wickra.org"
          git symbolic-ref HEAD refs/heads/main
          # Replace all tracked content with the freshly assembled tree.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r ../wickra-go-module/. .
          git add -A
          if git diff --cached --quiet; then
            echo "wickra-go already up to date; tagging only"
          else
            git -c commit.gpgsign=false commit -q -m "Release v$version"
          fi
          git push origin HEAD:refs/heads/main
          git tag "v$version"
          git push origin "v$version"

  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    # Every job that either produces an asset staged below or publishes something
    # the release notes claim. csharp-publish and java-publish upload the nupkg
    # and the jar this job stages, so without the dependency the release was
    # assembled before those files existed and, with fail_on_unmatched_files
    # false, shipped without them in silence. go-mirror produces no asset, but
    # the notes tell readers the Go module is live -- a release should not say so
    # before it is.
    needs:
      - cargo-publish
      - python-publish
      - node-publish
      - wasm-publish
      - c-abi-build
      - csharp-publish
      - java-publish
      - go-mirror
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Expose the resolved tag so the attestations job can attach the provenance
    # bundle to this same release without re-resolving it.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        # Pass the (potentially attacker-influenceable on a tag push) ref context
        # through the environment instead of interpolating it into the shell
        # script, so a crafted tag name cannot inject commands (zizmor:
        # template-injection).
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            # workflow_dispatch / non-tag push: attach to the latest v* tag.
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          # Python wheels + sdist (5 wheel artifacts + 1 sdist artifact).
          find artifacts -type f -name "*.whl" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          # Native Node binaries (one per platform).
          find artifacts -type f -name "*.node" -exec cp {} release-assets/ \;
          # Node npm-pack tarballs (main + per-platform).
          find artifacts -type f -name "wickra-*.tgz" -exec cp {} release-assets/ \;
          # Cargo .crate files (one per workspace member).
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          # CycloneDX SBOMs (one per published crate).
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          # NuGet package (the same file pushed to nuget.org).
          find artifacts -type f -name "*.nupkg" -exec cp {} release-assets/ \;
          # Java jar (the same file deployed to Maven Central).
          find artifacts -type f -name "*.jar" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          echo "asset-count=$(find release-assets -type f | wc -l)"

      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wickra ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Created as a draft; publish-release flips it to published + latest once
          # the provenance bundle is attached (P24, immutability-ready).
          draft: true
          body: |
            Wickra ${{ github.ref_name }} — streaming-first technical indicators for 10 languages: native Rust, Python, Node.js, WASM plus a C ABI hub for C, C++, C#, Go, Java, R.

            ### Install

            ```bash
            cargo add wickra
            pip install wickra
            npm install wickra
            npm install wickra-wasm
            dotnet add package Wickra
            go get github.com/wickra-lib/wickra-go
            ```

            Java (Gradle, Maven Central):

            ```gradle
            implementation("org.wickra:wickra:${{ steps.tag.outputs.version }}")
            ```

            R (r-universe):

            ```r
            install.packages("wickra", repos = "https://wickra-lib.r-universe.dev")
            ```

            ### Attached assets

            Pre-built artefacts for every supported platform — the same files this
            workflow run published to crates.io, PyPI, npm, NuGet and Maven
            Central. Go ships to the wickra-go module and R to r-universe via
            their own release jobs.

            - `*.whl` / `wickra-*.tar.gz` — Python wheels + sdist (5 platforms, ABI3 ≥ 3.9)
            - `wickra.*.node` — native Node.js bindings (linux-x64-gnu, darwin-x64,
              darwin-arm64, win32-x64-msvc)
            - `wickra-*.tgz` — npm-pack tarballs (main package + per-platform subpackages + WASM)
            - `*.crate` — cargo source crates (wickra-core, wickra-data, wickra)
            - `wickra-c-<target>.tar.gz` — C ABI: `include/wickra.h` + `wickra.hpp`
              and the cdylib/staticlib per target (linux/macos/windows × x64/arm64),
              the hub for C, C++, C#, Go, Java and R
            - `Wickra.<version>.nupkg` — the .NET package as pushed to nuget.org
            - `wickra-<version>.jar` — the Java binding as deployed to Maven
              Central, natives for all six platforms bundled in

            ### Auto-generated changelog

            See below; GitHub computes it from the commits since the previous tag.

  # --------------------------------------------------------------------------
  # Build provenance attestations (findings P13.2)
  # --------------------------------------------------------------------------
  attestations:
    name: Attest build provenance
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [cargo-publish, python-wheels, python-sdist, c-abi-build,
            csharp-publish, java-publish, github-release]
    runs-on: ubuntu-latest
    # Signed SLSA build-provenance attestations for everything published that
    # does not already carry provenance of its own. npm tarballs do -- `npm
    # publish --provenance` embeds it inline -- so the node and wasm packages are
    # covered there and are not repeated here.
    #
    # The .nupkg, the .jar and the C ABI archives were covered nowhere. They are
    # the two packages C# and Java consumers install and the archive people
    # download and link against, and Scorecard reported Signed-Releases 10/10
    # regardless, because it looks for a provenance file on the release rather
    # than for coverage of what the release contains.
    #
    # The job stays isolated from the *publishes*: cargo/PyPI/npm all run upstream
    # of github-release, so a Sigstore hiccup here can never block or corrupt a
    # publish (the isolation the SBOM step lacked before #79). It additionally
    # `needs: github-release` so the (still-draft) GitHub Release already exists
    # when it attaches the provenance bundle as a release asset (P21.1e) — OpenSSF
    # Scorecard's Signed-Releases check scans release *assets* (*.intoto.jsonl),
    # not GitHub's separate attestations store, so the bundle has to live on the
    # release. The release is published afterwards by the publish-release job
    # whether or not this attestation succeeds (P24), so a failure here still only
    # costs the provenance asset, never the release.
    permissions:
      id-token: write # OIDC for keyless Sigstore signing
      attestations: write # write the attestations to this repo
      contents: write # upload the provenance bundle as a release asset
    steps:
      - name: Download crate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts/python
          merge-multiple: true
      - name: Download the C ABI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: artifacts/c-abi
          merge-multiple: true
      - name: Download the NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Download the Java jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-jar
          path: artifacts/java
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/c-abi/*.tar.gz
            artifacts/nuget/*.nupkg
            artifacts/java/*.jar
            artifacts/crates/*.crate
            artifacts/python/*.whl
            artifacts/python/*.tar.gz

      # Attach the Sigstore provenance bundle to the GitHub Release as a
      # `*.intoto.jsonl` asset so OpenSSF Scorecard's Signed-Releases check finds
      # signed provenance on the release itself (P21.1e). attest-build-provenance
      # writes a single JSONL bundle covering every subject above; copy it to a
      # `.intoto.jsonl`-suffixed name and upload with --clobber so re-runs are
      # idempotent. github.token has contents: write here, which is all gh needs.
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Publish the drafted release LAST (P24 — immutability-ready).
  #
  # github-release creates the release as a draft and attestations attaches the
  # provenance bundle to it; only now, with every asset in place, is it flipped to
  # published + latest. With GitHub release immutability enabled, assets lock at
  # this publish step — so the provenance bundle and every build artefact are
  # already present and never need a (rejected) post-publish upload.
  #
  # `if: always() && needs.github-release.result == 'success'` preserves the old
  # robustness: the release is published whenever the draft was created, even if
  # the attestations job hit a Sigstore hiccup — that only costs the provenance
  # asset, exactly as before. If github-release was skipped (a publish job failed)
  # there is no draft, so this is skipped too and no release is published.
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # flip the draft release to published
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest=true --repo "${{ github.repository }}"