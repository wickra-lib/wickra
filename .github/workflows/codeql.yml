name: CodeQL

# Static analysis security testing (findings P13.x). Analyses the Rust core and
# the Python / JavaScript binding surfaces with GitHub's CodeQL engine. Results
# appear under Security → Code scanning. `build-mode: none` analyses source
# directly — no compilation step — for every language here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 0' # Sundays 03:31 UTC

# Least-privilege default for the auto-injected GITHUB_TOKEN. The analyze job
# raises exactly the scopes CodeQL needs (security-events: write to upload
# results) in its own job-level block below; this top-level read-only default
# covers any future job (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30  # backstop against a hung job, not a budget
    permissions:
      security-events: write # upload CodeQL results to code-scanning
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go and C/C++ were the two languages the matrix left out, and the
          # stated reason -- "C# and Java are the two bindings where a memory
          # mistake is possible" -- was simply wrong. bindings/go casts slice
          # base addresses through unsafe.Pointer and hands them to C, which is
          # undefined for an empty slice, and manages handle lifetimes with
          # runtime.SetFinalizer. bindings/r/src/wickra.c is C compiled into the
          # CRAN package, and include/wickra.hpp is a hand-written RAII wrapper
          # that the C examples compile and run in CI.
          # autobuild rather than manual: with a manual command CodeQL traced
          # the build and then finalised an empty database. Its Go extractor
          # runs its own build and finds the module in the subdirectory, which
          # is what the language wants. The C ABI library is still staged in
          # front of it, because cgo has to link.
          - language: go
            build-mode: autobuild
          - language: c-cpp
            build-mode: manual
          # C# and Java are compiled with an explicit command rather than read as
          # source. `build-mode: none` was tried first and GitHub reported the
          # result as low quality: 64% of C# calls resolved to a target against a
          # threshold of 85%. Two causes, and the second was self-inflicted --
          # without a build no dependency resolves, and paths-ignore keeps the
          # excluded generated files out of the database entirely, so the
          # hand-written code that calls into them pointed at nothing.
          #
          # Building fixes both at once: the generated code compiles, so the calls
          # resolve, while paths-ignore still filters its findings out of the
          # results. High resolution and no flood, rather than one or the other.
          #
          # `manual` over `autobuild`: this repository has several C# projects and
          # two Maven trees, and guessing which to build is how a scan ends up
          # quietly covering the wrong one.
          - language: csharp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the Java build needs this, and it needs a newer JDK than the
      # runner default: the binding targets java.lang.foreign and the pom sets
      # release 22.
      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      # Staged before CodeQL autobuilds: the cgo LDFLAGS point at
      # ${SRCDIR}/lib/<goos>_<goarch>, so without the library there the build
      # cannot link and nothing is extracted.

      # Go and C/C++ both need the C ABI library present before they build:
      # the Go binding links it through cgo, and the C examples link it via
      # CMake. One cargo build serves both.
      - name: Install Rust toolchain
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        uses: ./.github/actions/setup-rust

      - name: Build the C ABI library
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        run: cargo build -p wickra-c --release

      # Staged before CodeQL autobuilds: the cgo LDFLAGS point at
      # ${SRCDIR}/lib/<goos>_<goarch>, so without the library there the build
      # cannot link and nothing is extracted.
      - name: Stage the native library for cgo
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra.so bindings/go/lib/linux_amd64/

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      # The C examples consume the header and the hand-written C++ RAII
      # wrapper, so compiling them is what puts both in the database.
      # bindings/r/src/wickra.c is NOT covered here: it is built by the R
      # toolchain during package build, and pulling that in would add a
      # fragile dependency for one generated file. Said plainly rather than
      # left to look like coverage.
      - name: Build the C and C++ examples
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release

      # CodeQL sees exactly what the compiler walks, so anything it does not
      # build is not analysed. Building only the test project left the eleven
      # examples and the benchmark unscanned -- 11 of 23 C# files -- and the
      # examples are the code people copy into their own projects.
      - name: Build the C# binding, examples and benchmarks
        if: matrix.language == 'csharp'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build bindings/csharp/Wickra.Tests/Wickra.Tests.csproj -c Release
          dotnet build bindings/csharp/benchmarks/Benchmarks.csproj -c Release
          for d in streaming backtest multi_timeframe parallel_assets \
                   strategy_rsi_mean_reversion strategy_macd_adx \
                   strategy_bollinger_squeeze fetch_btcusdt live_binance; do
            dotnet build "examples/csharp/$d" -c Release
          done

      # -DskipTests, not -Dmaven.test.skip: the hand-written tests still
      # compile, and they are ten of the eleven binding files left after the
      # exclusions. CodeQL needs the code compiled, not exercised.
      #
      # examples/java is a separate Maven project, so it resolves
      # org.wickra:wickra as a normal dependency rather than through a reactor.
      # It has to come out of the local repository, which is why the binding is
      # installed rather than merely compiled: the version in the tree is the
      # one being released, and it does not exist on Maven Central until the tag
      # publishes it. Resolving from Central instead made this job fail on every
      # version bump, on a lookup for the artefact the bump exists to create.
      # Installing first also means the examples are analysed against the
      # binding in this tree, which is the code under review.
      - name: Build the Java binding and examples
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f bindings/java install -DskipTests
          mvn -B -f examples/java test-compile -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
