name: Link check

# External link rot is non-deterministic (third-party sites go down, rate-limit,
# or move), so this sweep runs weekly and on demand and never fails: lychee
# runs with continue-on-error on the step, every broken link becomes a warning
# annotation and a line in the job summary, and main_status lists them. A red
# run would sit on the newest main commit and read as a broken main. release.yml
# does not depend on it.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: External links (lychee)
    runs-on: ubuntu-26.04
    timeout-minutes: 20  # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        id: lychee
        continue-on-error: true
        timeout-minutes: 18
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md" "bindings/*/README.md"
          fail: true
      - name: Report broken links as warnings
        if: steps.lychee.outcome == 'failure'
        run: |
          if [ -f lychee/out.md ]; then
            grep -E '^\* \[' lychee/out.md | head -n 30 \
              | sed -e 's/%/%25/g' -e 's/^\* /::warning title=Broken link::/' || true
          fi
          echo "::warning title=Broken links::lychee did not pass; the job summary lists every finding"
