version: 2
updates:
  # Rust workspace (root Cargo.toml + all member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo)"
    # ureq is intentionally pinned to 2.x. ureq 3 unconditionally pulls
    # webpki-root-certs (CDLA-Permissive-2.0); the native-tls / OS-trust-store
    # setup in wickra-data deliberately avoids that licence. Block the major
    # bump (2.x patch/minor still flow through).
    ignore:
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]
    groups:
      # napi-rs (napi / napi-derive / napi-build) is a coordinated major
      # migration that must move with @napi-rs/cli on the npm side — keep it in
      # its own PR rather than bundled with unrelated crate bumps.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["napi", "napi-derive", "napi-build"]

  # The fuzz targets are their own cargo workspace -- the root Cargo.toml
  # excludes them -- so the cargo entry above does not reach fuzz/Cargo.lock.
  # It pins libfuzzer-sys and arbitrary, which received no security updates
  # while nothing watched them.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(cargo-fuzz)"
    # The fuzz lockfile resolves through a path dependency on the workspace, so
    # a proposal here can land in crates/wickra-data/Cargo.toml -- which is how
    # #425 arrived titled "/fuzz" while changing the main tree. ureq is pinned to
    # 2.x for the same reason as in the root entry: ureq 3 hard-depends on
    # webpki-root-certs (CDLA-Permissive-2.0) regardless of TLS backend, and that
    # licence is not in deny.toml's allow list, so the bump cannot pass the
    # supply-chain gate.
    # No `update-types` here, unlike the root entry. Dependabot proposed ureq
    # 2 -> 3 three times (#425, #435, #437), the last one against a base that
    # already carried the semver-major form of this ignore -- so that form does
    # not match a *requirement* change the way it matches a version update.
    # Ignoring the dependency outright is what actually holds.
    #
    # Nothing is lost by the blunter form: the root cargo entry keeps its
    # `update-types`, so ureq 2.x patches still arrive from there.
    ignore:
      - dependency-name: "ureq"
    groups:
      cargo-fuzz:
        patterns: ["*"]

  # Node binding npm dependencies.
  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-binding:
        patterns: ["*"]

  # Python binding pip dependencies.
  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(pip)"
    groups:
      python-binding:
        patterns: ["*"]

  # Hash-pinned CI/bench Python tooling under .github/requirements/. Each
  # <name>.in is the loose source; the matching hash-locked <name>.txt is the
  # output regenerated by scripts/update-lockfiles.sh (uv). Dependabot keeps the
  # pins fresh; ci-dev-py39.in caps numpy <2.1 so 3.9 stays installable. Any
  # bump that breaks a matrix row surfaces in the PR's CI run.
  - package-ecosystem: pip
    directory: "/.github/requirements"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    # Version-update PRs disabled (0): the hash-locked CI dev tooling is
    # regenerated by scripts/update-lockfiles.sh (uv, which honours each row's
    # target Python via --python-version). Dependabot bumps the .txt directly
    # and does NOT respect those targets, so every ci-pip group PR broke the
    # 3.9 rows (dropped `==` pins / pulled py3.10-only pytest/numpy/hypothesis).
    # Security updates are exempt from the limit and still arrive -- which is
    # why there is no `ignore` list below.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(ci-pip)"
    groups:
      ci-pip:
        patterns: ["*"]
    # No `ignore` here, deliberately. `open-pull-requests-limit: 0` above
    # already suppresses every version-update pull request for this ecosystem,
    # so an ignore adds nothing there. Its only remaining effect would be on
    # *security* updates, which are exempt from the limit and are the one thing
    # that should still get through.
    #
    # Three ignores used to sit here -- numpy, hypothesis, pytest -- each added
    # because a bump broke the 3.9 matrix rows. That reasoning is about version
    # updates, which the limit handles. Keeping them meant a future advisory in
    # any of the three would produce no pull request at all: silence, rather
    # than a red one somebody decides about. A security bump that breaks the
    # 3.9 row is a visible problem; a suppressed advisory is not.
    #
    # Detection no longer rests on Dependabot either: osv-scanner runs in
    # ci.yml across every ecosystem and fails the build on a vulnerable
    # dependency whether or not a pull request exists.

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads
  # the version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns: ["*"]

  # Java binding + examples (Maven). Tracks the C-ABI binding's build plugins
  # (e.g. central-publishing-maven-plugin) and the examples' jackson dependency,
  # which had no Dependabot coverage before — a stale publishing plugin slipped
  # through unnoticed until an OSV scan flagged it.
  - package-ecosystem: maven
    directories:
      - "/bindings/java"
      - "/bindings/java/benchmarks"
      - "/examples/java"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(maven)"
    groups:
      maven:
        patterns: ["*"]

  # C# binding (NuGet). The published Wickra.csproj is a thin C-ABI wrapper with
  # no external packages, but the test and benchmark projects pull xunit,
  # Microsoft.NET.Test.Sdk and BenchmarkDotNet.
  - package-ecosystem: nuget
    directories:
      - "/bindings/csharp/Wickra.Tests"
      - "/bindings/csharp/benchmarks"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(nuget)"
    groups:
      nuget:
        patterns: ["*"]

  # Node examples (npm) — separate from the binding's own package.json.
  - package-ecosystem: npm
    directory: "/examples/node"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      node-examples:
        patterns: ["*"]

  # Go modules: the binding (no external deps today, listed so a dependency
  # it grows is covered like the sibling repos') and the examples, which pull
  # coder/websocket.
  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
  - package-ecosystem: gomod
    directory: "/examples/go"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(gomod)"
    groups:
      go-examples:
        patterns: ["*"]
